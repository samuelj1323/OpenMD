[package]
name = "openmd-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "openMD app shell: CLI today, GPUI native editor UI next"

[[bin]]
name = "openmd"
path = "src/main.rs"

[dependencies]
openmd-core = { path = "../core" }
openmd-storage = { path = "../storage" }

